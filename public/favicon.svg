<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241E1A" />
      <stop offset="100%" stop-color="#14110F" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7D3" />
      <stop offset="50%" stop-color="#DFCFB7" />
      <stop offset="100%" stop-color="#C5AF8E" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#128C7E" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded squircle / circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.25" />

  <!-- Monogram SC Group -->
  <g filter="url(#subtleShadow)">
    <!-- Elegant Serif 'S' -->
    <text 
      x="195" 
      y="325" 
      font-family="'Cormorant Garamond', 'Didot', 'Bodoni MT', 'Cinzel', serif" 
      font-size="250" 
      font-weight="600" 
      font-style="italic"
      fill="url(#goldGrad)" 
      text-anchor="middle"
      letter-spacing="-10"
    >S</text>

    <!-- Elegant Serif 'C' interlocking -->
    <text 
      x="315" 
      y="325" 
      font-family="'Cormorant Garamond', 'Didot', 'Bodoni MT', 'Cinzel', serif" 
      font-size="250" 
      font-weight="400" 
      fill="url(#goldGrad)" 
      text-anchor="middle"
      letter-spacing="-10"
      opacity="0.9"
    >C</text>
  </g>

  <!-- Refined WhatsApp pulse badge at top-right -->
  <circle cx="396" cy="116" r="34" fill="#14110F" />
  <circle cx="396" cy="116" r="26" fill="url(#accentGrad)" />
  
  <!-- Mini WhatsApp bubble shape -->
